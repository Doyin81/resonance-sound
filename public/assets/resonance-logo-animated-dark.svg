<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="Resonance by Awhizy logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .rr{animation:rp 1.8s ease-in-out infinite}
    .r2{animation-delay:.25s}
    .r3{animation-delay:.5s}
    .dot{transform-box:fill-box;transform-origin:center;animation:beat 1.8s ease-in-out infinite}
    @keyframes rp{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.3)}}
    @media (prefers-reduced-motion:reduce){.rr,.dot{animation:none}}
  </style>
  <g fill="none" stroke="#4FB6BF" stroke-width="4">
    <circle class="rr r1" cx="40" cy="40" r="15"/>
    <circle class="rr r2" cx="40" cy="40" r="25"/>
    <circle class="rr r3" cx="40" cy="40" r="34"/>
  </g>
  <circle class="dot" cx="40" cy="40" r="6" fill="#FF5A4E"/>
  <text x="92" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#E8EEF0">Resonance</text>
  <text x="94" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" letter-spacing="3.5" fill="#4FB6BF">BY AWHIZY</text>
</svg>
