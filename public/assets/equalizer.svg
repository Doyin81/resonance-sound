<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title">
  <title id="title">Animated graphic equalizer with real-time audio analyzer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10181d"/>
      <stop offset="1" stop-color="#14212b"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#1f6f78"/>
      <stop offset=".58" stop-color="#4fb6bf"/>
      <stop offset="1" stop-color="#ff5a4e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#4fb6bf" stop-opacity=".27"/>
      <stop offset="1" stop-color="#4fb6bf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .rta-bar{transform-box:fill-box;transform-origin:center bottom;animation:rta .62s ease-in-out infinite alternate}
      .rta-bar:nth-child(4n+1){animation-duration:.48s}
      .rta-bar:nth-child(4n+2){animation-duration:.73s}
      .rta-bar:nth-child(4n+3){animation-duration:.56s}
      .live-dot{animation:live 1s ease-in-out infinite}
      @keyframes rta{from{transform:scaleY(.3)}to{transform:scaleY(1.15)}}
      @keyframes live{50%{opacity:.3}}
      @media(prefers-reduced-motion:reduce){.rta-bar,.live-dot{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <ellipse cx="600" cy="280" rx="590" ry="370" fill="url(#glow)"/>
